# Forceps tracking stack:  detector -> orchestrator -> stream -> viz
#   detector      classical-CV tip/shadow/junction detection + live source + annotated MJPEG   :8000
#   orchestrator  calibration UI / API; receives points from the detector                      :8090
#   stream        3D position computation, websocket feed                                      :8765
#   viz           React/Three.js 3D dashboard                                                  :8080
services:
  detector:
    build: ./services/detector
    environment:
      # video file (looped, real-time paced) | rtsp://... | http://... MJPEG | leave a stream URL for live footage
      SOURCE: ${SOURCE:-/data/video/forceps_lev1.mp4}
      SOURCE_LOOP: ${SOURCE_LOOP:-1}
      # empty value = learn the empty retina from the live feed (BOOTSTRAP_SECONDS)
      BACKGROUND_PATH: ${BACKGROUND_PATH-/data/background.png}
      BOOTSTRAP_SECONDS: ${BOOTSTRAP_SECONDS:-8}
      ORCHESTRATOR_URL: http://orchestrator:8090
      PUSH_HZ: ${PUSH_HZ:-15}
      SMOOTHING: ${SMOOTHING:-0.5}
      DETECTOR_STATE: /state/config.json      # source + eye circle chosen in the orchestrator UI (wins over SOURCE)
    volumes:
      - ./data:/data:ro
      - detector-state:/state
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  orchestrator:
    build: ./services/orchestrator
    environment:
      SEGMENTATION_URL: http://detector:8000
      STREAM_URL: http://stream:8765
      ORCHESTRATOR_CALIBRATION_PATH: /state/calibration.json
      ORCHESTRATOR_DEFAULT_CALIBRATION: /app/default_calibration.json
      DETECTOR_URL: http://detector:8000        # switchable in the UI, e.g. http://host.docker.internal:8001 for a native detector
      ORCHESTRATOR_DETECTOR_PATH: /state/detector.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"
    volumes:
      - ./config/default_calibration.json:/app/default_calibration.json:ro
      - orchestrator-state:/state
    depends_on:
      - detector
      - stream
    restart: unless-stopped

  stream:
    build: ./services/stream
    command: ["python", "ws_server.py", "--host", "0.0.0.0", "--port", "8765", "--interval", "0.033",
              "--input", "/state/predicted_input.json"]
    ports:
      - "8765:8765"
    volumes:
      - ./config/stream_seed.json:/seed/predicted_input.json:ro
      - stream-state:/state
    entrypoint: ["/bin/sh", "-c", "[ -f /state/predicted_input.json ] || cp /seed/predicted_input.json /state/predicted_input.json; exec \"$@\"", "--"]
    restart: unless-stopped

  viz:
    build:
      context: ./services/viz
      args:
        VITE_DEFAULT_SOURCE: live
    ports:
      - "8080:80"
    depends_on:
      - stream
    restart: unless-stopped

volumes:
  detector-state:
  orchestrator-state:
  stream-state:
